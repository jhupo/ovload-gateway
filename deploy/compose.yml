name: ovload-gateway
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  gateway:
    image: ${OVLOAD_IMAGE:-ovload-gateway:local}
    restart: unless-stopped
    command: [serve]
    environment:
      CPR_SERVER_HOST: 0.0.0.0
      CPR_SERVER_PORT: '8080'
      CPR_WEB_DIST_DIR: /app/web
      CPR_DATABASE_URL: postgres://ovload@postgres:5432/ovload
      CPR_REDIS_URL: redis://redis:6379/0
      CPR_DEPLOYMENT_MODE: docker
      CPR_UPDATE_EXE_PATH: /usr/local/bin/ovload-gateway
      CPR_UPDATE_REPOSITORY: jhupo/ovload-gateway
      CPR_ENABLE_SELF_RESTART: 'false'
      CPR_ANTIGRAVITY_CLIENT_ID: ${CPR_ANTIGRAVITY_CLIENT_ID:-}
      CPR_ANTIGRAVITY_CLIENT_SECRET: ${CPR_ANTIGRAVITY_CLIENT_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${OVLOAD_CONFIG_DIRECTORY:-../private}
        target: /app/deploy
        read_only: true
        bind: {create_host_path: false}
      - runtime-data:/app/.runtime
    networks: [edge, data]
    read_only: true
    tmpfs: ['/tmp:uid=10001,gid=10001,mode=1770']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging: *logging
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    # The official Caddy binary carries cap_net_bind_service. Its image user
    # (1001:118) can execute it after all ambient capabilities are dropped.
    user: '1001:118'
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      OVLOAD_PUBLIC_HOST: ${OVLOAD_PUBLIC_HOST:-localhost}
    depends_on:
      gateway: {condition: service_healthy}
    ports: ['${OVLOAD_BIND:-127.0.0.1}:${OVLOAD_PORT:-51771}:8443']
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OVLOAD_TLS_DIRECTORY:-../private/tls}
        target: /etc/caddy/tls
        read_only: true
        bind: {create_host_path: false}
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    read_only: true
    tmpfs: ['/tmp:uid=10001,gid=10001,mode=1770']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *logging
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.9-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ovload
      POSTGRES_USER: ovload
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, ovload, -d, ovload]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    logging: *logging
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.8-bookworm}
    restart: unless-stopped
    user: redis
    command: [redis-server, /run/secrets/redis.conf]
    secrets: [redis-password, redis.conf]
    volumes: [redis-data:/data]
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
networks:
  edge:
  data: {internal: true}
volumes:
  postgres-data:
  redis-data:
  runtime-data:
  caddy-data:
  caddy-config:
secrets:
  postgres-password:
    file: ${OVLOAD_CONFIG_DIRECTORY:-../private}/postgres-password
  redis-password:
    file: ${OVLOAD_CONFIG_DIRECTORY:-../private}/redis-password
  redis.conf:
    file: ${OVLOAD_CONFIG_DIRECTORY:-../private}/redis.conf
