name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/version.py check
      - run: python scripts/check_reports.py
      - run: python -m unittest discover -s tests/tooling -v
      - run: git diff --check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --test architecture_contract
      - run: cargo test --locked --workspace
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OVLOAD_LOCAL_IMAGE: ovload-gateway:ci
      OVLOAD_BLUE_IMAGE: ovload-gateway:ci
      OVLOAD_GREEN_IMAGE: ovload-gateway:ci
      OVLOAD_WORKER_IMAGE: ovload-gateway:ci
      POSTGRES_PASSWORD: ci-disposable-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test deployment without publishing
        run: |
          mkdir -p deploy/provider-secrets
          sudo chown 10001:10001 deploy/provider-secrets
          sudo chmod 0700 deploy/provider-secrets
          docker compose -f deploy/compose.yml -f deploy/compose.build.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.build.yml build api-blue
          docker compose -f deploy/compose.yml up -d --wait --wait-timeout 120 postgres redis
          docker compose -f deploy/compose.yml --profile api-blue run --rm --no-deps api-blue migrate
          docker compose -f deploy/compose.yml --profile api-blue --profile api-green --profile worker up -d --no-deps --wait --wait-timeout 120 api-blue api-green worker
          docker compose -f deploy/compose.yml up -d --no-deps --wait --wait-timeout 120 caddy
          docker compose -f deploy/compose.yml exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/ | grep -q 'Ovload Gateway'
          caddy_before=$(docker compose -f deploy/compose.yml ps -q caddy)
          pg_before=$(docker compose -f deploy/compose.yml ps -q postgres)
          redis_before=$(docker compose -f deploy/compose.yml ps -q redis)
          api_blue_before=$(docker compose -f deploy/compose.yml --profile api-blue ps -q api-blue)
          api_green_before=$(docker compose -f deploy/compose.yml --profile api-green ps -q api-green)
          docker compose -f deploy/compose.yml --profile api-green up -d --no-deps --force-recreate --wait --wait-timeout 120 api-green
          test "$caddy_before" = "$(docker compose -f deploy/compose.yml ps -q caddy)"
          test "$pg_before" = "$(docker compose -f deploy/compose.yml ps -q postgres)"
          test "$redis_before" = "$(docker compose -f deploy/compose.yml ps -q redis)"
          test "$api_blue_before" = "$(docker compose -f deploy/compose.yml --profile api-blue ps -q api-blue)"
          test "$api_green_before" != "$(docker compose -f deploy/compose.yml --profile api-green ps -q api-green)"
          docker compose -f deploy/compose.yml --profile api-blue exec -T api-blue curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          docker compose -f deploy/compose.yml --profile api-green exec -T api-green curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          docker compose -f deploy/compose.yml --profile worker exec -T worker ovload-gateway worker-ready
          curl --fail http://127.0.0.1:8080/readyz
          python -m unittest discover -s tests/deploy -v
          OVLOAD_RUN_DOCKER_RELEASE_TESTS=1 python -m unittest discover -s tests/deploy -p test_caddy_release_switch.py -v
      - name: Scan images
        run: |
          for image in "$OVLOAD_LOCAL_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose -f deploy/compose.yml --profile api-blue --profile api-green --profile worker logs --no-color --tail=100
          docker compose -f deploy/compose.yml --profile api-blue --profile api-green --profile worker down --remove-orphans

  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.8-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: ovload
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: ovload_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ovload -d ovload_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@v2
      - name: Create isolated integration databases
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          for database in ovload_billing_test ovload_gateway_storage_test ovload_gateway_recovery_test; do
            docker exec "$POSTGRES_SERVICE_ID" createdb --username ovload --maintenance-db postgres "$database"
          done
      - run: cargo test --locked --test storage_contract -- --ignored
        env:
          OVLOAD_TEST_DATABASE_URL: postgres://ovload:ci-disposable-only@localhost:5432/ovload_test
      - run: cargo test --locked --test jobs_contract -- --ignored
        env:
          OVLOAD_TEST_DATABASE_URL: postgres://ovload:ci-disposable-only@localhost:5432/ovload_test
          OVLOAD_TEST_REDIS_URL: redis://localhost:6379/0
      - run: cargo test --locked --test billing_contract -- --ignored
        env:
          OVLOAD_TEST_DATABASE_URL: postgres://ovload:ci-disposable-only@localhost:5432/ovload_billing_test
      - run: cargo test --locked --test gateway_storage_contract -- --ignored
        env:
          OVLOAD_TEST_DATABASE_URL: postgres://ovload:ci-disposable-only@localhost:5432/ovload_gateway_storage_test
      - run: cargo test --locked --test gateway_recovery_contract -- --ignored
        env:
          OVLOAD_TEST_DATABASE_URL: postgres://ovload:ci-disposable-only@localhost:5432/ovload_gateway_recovery_test
      - run: cargo test --locked --test gateway_admission_contract -- --ignored
        env:
          OVLOAD_TEST_REDIS_URL: redis://localhost:6379/1
