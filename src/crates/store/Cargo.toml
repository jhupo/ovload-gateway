# Modified for Ovload on 2026-10-27: workspace integration.

[package]
name = "ovload-store"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99.1"
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
async-compression = { version = "0.4.50", default-features = false, features = ["tokio", "gzip"] }
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "1.140", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-runtime-api = "1.14"
aws-smithy-types = "1.6"
chrono = "0.4.45"
fs2 = "0.4"
futures = "0.3.32"
ovload-admin = { path = "../admin" }
ovload-core = { path = "../core" }
hex = "0.4.3"
redis = { version = "1.3.0", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "socks"] }
ring = "0.17.14"
spki = "0.8"
secrecy = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros", "migrate", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52", default-features = false, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["serde", "v4", "v7"] }

[dev-dependencies]
percent-encoding = "2.3"
tempfile = "3.23"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "process", "time", "test-util"] }

[lints]
workspace = true
