[package]
name = "ovload-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ovload-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ovload-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
redis = { version = "1.7.0", features = ["tokio-comp"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[[test]]
name = "http_contract"
path = "../../tests/rust/http_contract.rs"

[[test]]
name = "storage_contract"
path = "../../tests/rust/storage_contract.rs"
